# Bloc nginx pour Bana Shop, à installer dans /etc/nginx/sites-available.
#
# nginx occupe déjà les ports 80 et 443 sur cette machine, et Caddy ne peut donc pas s'y lier.
# Plutôt que de réécrire le routage de l'application dans nginx — chemin /pilote, repli SPA,
# en-têtes de cache, service worker non mis en cache —, on garde ce routage là où il est déjà
# écrit et vérifié, dans le Caddyfile, et nginx ne fait qu'une chose : terminer le TLS et
# transmettre. Le second saut est sur la boucle locale, il ne coûte rien.
#
# Le certificat est l'affaire de certbot :
#   sudo certbot --nginx -d VOTRE_DOMAINE

server {
    listen 80;
    listen [::]:80;
    server_name VOTRE_DOMAINE;

    # certbot réécrira ce bloc pour ajouter la redirection vers 443 et les directives ssl_*.
    # Tant qu'il n'est pas passé, le site répond en clair — utile pour vérifier que la pile
    # tourne avant de s'occuper du certificat.

    # Les paquets de mise à jour des terminaux font plusieurs dizaines de mégaoctets, et le
    # défaut de nginx est à 1 Mo : sans cela, la CI ne pourrait rien déposer.
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Caddy et l'application derrière lui doivent savoir que la requête est arrivée en
        # HTTPS, sinon toute redirection qu'ils construiraient repasserait en clair.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Un terminal sur une connexion lente met du temps à tirer un paquet complet.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_request_buffering off;
    }
}
