name: Build Windows

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build & Test Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET version
        run: dotnet --info

      - name: Restore
        run: dotnet restore .\BoutiqueFashion.slnx

      - name: Run tests
        run: dotnet test .\BoutiqueFashion.slnx --configuration Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish
          .\src\BoutiqueFashion.App\BoutiqueFashion.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o .\artifacts\win-x64

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\artifacts\win-x64\* `
            -DestinationPath .\artifacts\BoutiqueFashion-win-x64.zip `
            -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: BoutiqueFashion-win-x64
          path: .\artifacts\win-x64

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BoutiqueFashion-win-x64-zip
          path: .\artifacts\BoutiqueFashion-win-x64.zip
