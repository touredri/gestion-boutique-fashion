name: Build Windows

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build & Test Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET version
        run: dotnet --info

      - name: Restore
        run: dotnet restore .\BoutiqueFashion.slnx

      - name: Run tests
        run: dotnet test .\BoutiqueFashion.slnx --configuration Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish
          .\src\BoutiqueFashion.App\BoutiqueFashion.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o .\artifacts\win-x64

      - name: Check published files
        shell: pwsh
        run: |
          Write-Host "=== Published files ==="
          Get-ChildItem .\artifacts\win-x64 -Recurse |
            Select-Object FullName, Length

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Check Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              Write-Error "Inno Setup n'est pas installé."
              exit 1
          }

          Write-Host "Inno Setup trouvé : $iscc"
          & $iscc /?

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              Write-Error "ISCC.exe introuvable."
              exit 1
          }

          if (-not (Test-Path ".\installer\BoutiqueFashion.iss")) {
              Write-Error "installer\BoutiqueFashion.iss introuvable."
              exit 1
          }

          & $iscc ".\installer\BoutiqueFashion.iss"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "La compilation Inno Setup a échoué."
              exit $LASTEXITCODE
          }

      - name: Check installer
        shell: pwsh
        run: |
          Write-Host "=== Installer files ==="

          if (-not (Test-Path ".\installer\output")) {
              Write-Error "Le dossier installer\output n'existe pas."
              exit 1
          }

          $files = Get-ChildItem ".\installer\output" -Filter "*.exe"

          if ($files.Count -eq 0) {
              Write-Error "Aucun fichier .exe n'a été produit par Inno Setup."
              exit 1
          }

          $files | Select-Object FullName, Length

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: BanaShop-win-x64
          path: .\artifacts\win-x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BanaShop-Setup
          path: .\installer\output\*.exe
